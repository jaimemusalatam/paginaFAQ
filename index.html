<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de ayuda | Musa</title>
<meta name="description" content="Encuentra respuestas sobre cursos, cuentas, licencias, certificados y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="#" aria-label="Musa – Centro de ayuda"><span class="brand__mark">m</span><span class="brand__name">musa</span><span class="brand__tag">Ayuda</span></a>
    <nav class="topnav">
      <a href="#categorias">Temas</a>
      <a href="#populares">Populares</a>
      <a href="#contacto" class="btn btn--sm">Contáctanos</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>¿Cómo podemos ayudarte?</h1>
    <form class="search" role="search" onsubmit="return false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm10 2-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Busca una pregunta, ej. “certificado”" autocomplete="off" aria-label="Buscar en el centro de ayuda">
    </form>
  </div>
</section>

<main class="wrap">
  <section id="resultados" class="results" hidden>
    <h2 id="resTitle"></h2>
    <div id="resList" class="faqlist"></div>
  </section>

  <section id="categorias" class="block">
    <h2>Explora por tema</h2>
    <div id="cats" class="cats"></div>
  </section>

  <section id="detalle" class="block" hidden>
    <button class="back" id="back">← Todos los temas</button>
    <h2 id="detTitle"></h2>
    <p id="detDesc" class="muted"></p>
    <div id="detList" class="faqlist"></div>
  </section>

  <section id="populares" class="block">
    <h2>Preguntas populares</h2>
    <div id="pop" class="faqlist"></div>
  </section>

  <section id="contacto" class="contact">
    <div>
      <h2>¿No encontraste lo que buscabas?</h2>
      <p>Nuestro equipo te responde de lunes a viernes, de 9:00 a 18:00 (hora Perú).</p>
    </div>
    <a class="btn btn--light" href="mailto:soporte@musa.la">Escríbenos</a>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span>© <span id="yr"></span> Musa. Todos los derechos reservados.</span>
    <a href="https://musa.la/">musa.la</a>
  </div>
</footer>
<script src="app.js"></script>
</body>
</html>
